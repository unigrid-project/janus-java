name: Janus installers

on:
  workflow_dispatch:

  # The release workflow builds its installers through this one, so they are built and tested the same way.
  workflow_call:
    inputs:
      version:
        description: "The version the installers are made for; the version of the build when left empty"
        type: string
        default: ''

  pull_request:
    branches: [ "master" ]
    paths:
      - "desktop/**"
      - "shell/**"
      - "ui/**"
      - "web/**"
      - "core/**"
      - "pom.xml"
      - ".github/workflows/installers.yml"

  push:
    branches: [ "master" ]
    paths:
      - "desktop/**"
      - "shell/**"
      - "ui/**"
      - "web/**"
      - "core/**"
      - "pom.xml"
      - ".github/workflows/installers.yml"

jobs:
  installers:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-14, windows-2022 ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Only in this working copy: the version is never committed.
    - name: Set the version to release
      if: inputs.version
      env:
        VERSION: ${{ inputs.version }}
      run: mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      shell: bash

    - name: Install the Linux packaging tools
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y rpm fakeroot xvfb

    - name: Put WiX 3 on the path
      if: runner.os == 'Windows'
      # Newer runner images come with it, and Chocolatey refuses to install the same release again.
      run: |
        [ -x "/c/Program Files (x86)/WiX Toolset v3.14/bin/candle.exe" ] \
          || choco install wixtoolset --version 3.14.1 -y --no-progress
        echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $GITHUB_PATH
      shell: bash

    # On Linux this also installs the packages in clean containers and runs Janus from them, and every OS
    # installs its own package and walks the wallet through its journeys in the installed window.
    - name: Build and test the installers
      run: >-
        ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}mvn -B -Pinstaller -pl desktop -am verify
        -Djanus.installed-wallet=true
      shell: bash

    - name: Collect the installers
      run: desktop/collect-installers.sh "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
      shell: bash

    - uses: actions/upload-artifact@v4
      with:
        name: installers-${{ runner.os }}
        path: desktop/target/release/*
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: installed-wallet-${{ runner.os }}
        path: |
          desktop/target/installed-wallet
          desktop/target/failsafe-reports
