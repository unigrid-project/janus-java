name: Janus release

# Started by pushing a tag such as v2.0.0, or by hand with a version. Either way it builds and tests the
# installers of that commit on every platform and then leaves a draft release with them, which nobody
# sees until it is published from the Releases page.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 2.0.0, without a leading v"
        type: string
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

jobs:
  check:

    runs-on: ubuntu-22.04

    permissions:
      actions: read
      contents: read

    outputs:
      version: ${{ steps.what.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check what is about to be released
      id: what
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [ "$EVENT" = "push" ]; then
          version="${GITHUB_REF_NAME#v}"

          # A tag can be pushed from any branch; only what master holds is ever released.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "$GITHUB_REF_NAME is not on master" >&2
            exit 1
          fi
        else
          version="$INPUT_VERSION"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Releases are made from master, not from $GITHUB_REF" >&2
            exit 1
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like 2.0.0, not '$version'" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged" >&2
            exit 1
          fi
        fi

        passed=$(gh run list --repo "$REPOSITORY" --workflow maven.yml --commit "$GITHUB_SHA" \
          --status success --json databaseId --jq length)

        if [ "$passed" -eq 0 ]; then
          echo "The build checks have not passed for $GITHUB_SHA" >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

  installers:

    needs: check
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ needs.check.outputs.version }}

  draft:

    needs: [check, installers]

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: installers-*
        merge-multiple: true
        path: dist

    - name: Write the checksums
      working-directory: dist
      run: sha256sum janus-* > SHA256SUMS

    - name: Leave a draft release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.check.outputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        flags=""

        if [ "$PRERELEASE" = "true" ]; then
          flags="--prerelease"
        fi

        gh release create "v$VERSION" dist/* --draft $flags --target "$GITHUB_SHA" \
          --title "Janus $VERSION" --notes-file .github/release-notes.md --generate-notes
