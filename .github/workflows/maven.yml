name: Janus build status

on:
  workflow_dispatch:

  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build main
      run: mvn install

    # Pull requests only read the repository, so the badge is only ever written from master.
    - name: Publish the coverage badge
      if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      run: .github/publish-coverage-badge.sh

  browser:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build main without tests
      run: mvn -B install -DskipTests

    - name: Install Chromium for Playwright
      run: >-
        mvn -B -Pbrowser -pl e2e exec:java -Dexec.mainClass=com.microsoft.playwright.CLI
        -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"

    - name: Run browser tests
      run: mvn -B -Pbrowser -pl e2e verify
