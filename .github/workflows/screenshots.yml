name: Reset screenshots

# Photographs resetting the wallet by hand on each desktop: the .janus folder with the file that names the
# chosen wallet, removing that file, and Unigrid opening on its start screen again. Runs on this branch only and
# keeps the pictures as artifacts.
on:
  push:
    branches: [ "screenshots" ]

permissions:
  actions: read
  contents: read

env:
  RELEASE_RUN: 37044054104
  EVM_WALLET: evm-0x9858EfFD232B4033E47d90003D41EC34EcaEda94.json
  BACKUP: wallet-20261002-191512.dat
  HEDGEHOG: 0.0.8

jobs:
  macos:

    runs-on: macos-15
    timeout-minutes: 25

    steps:
    - name: Fetch the release installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name installers-macOS --dir download

    - name: Install Unigrid and give it a wallet to forget
      run: |
        hdiutil attach -nobrowse -mountpoint /Volumes/UnigridInstaller download/*.dmg
        cp -R /Volumes/UnigridInstaller/Unigrid.app /Applications/
        hdiutil detach /Volumes/UnigridInstaller
        mkdir -p ~/.janus/wallets ~/.janus/backups ~/.janus/hedgehog/$HEDGEHOG
        echo '{}' > ~/.janus/wallets/$EVM_WALLET
        : > ~/.janus/backups/$BACKUP
        : > ~/.janus/hedgehog.log
        printf '%s' ~/.janus/wallets/$EVM_WALLET > ~/.janus/wallet
        system_profiler SPDisplaysDataType | grep -i resolution || true

    - name: Photograph the reset
      timeout-minutes: 8
      run: |
        mkdir shots
        defaults write com.apple.finder AppleShowAllFiles -bool true
        killall Finder || true
        sleep 4
        screencapture -x shots/00-desktop.png
        open -R ~/.janus/wallet
        sleep 5
        screencapture -x shots/01-finder-wallet-selected.png

        cat > ~/reset.command <<'EOF'
        #!/bin/bash
        clear
        run() { printf '\033[1m%s\033[0m\n' "$ $1"; eval "$1"; }
        run 'cp -a ~/.janus ~/janus-copy'
        run 'rm ~/.janus/wallet'
        run 'ls ~/.janus'
        EOF
        chmod +x ~/reset.command
        open -a Terminal ~/reset.command
        sleep 8
        screencapture -x shots/02-terminal-reset.png

        killall Terminal || true
        open ~/.janus
        sleep 5
        screencapture -x shots/03-finder-wallet-gone.png

        killall Finder || true
        sleep 3
        (open /Applications/Unigrid.app > open.log 2>&1 &)
        sleep 20
        screencapture -x shots/04-start-screen-20s.png
        sleep 20
        screencapture -x shots/05-start-screen-40s.png
        ls -l shots
        cat open.log || true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reset-macos
        path: shots

  windows:

    runs-on: windows-2022
    timeout-minutes: 25

    steps:
    - name: Fetch the release installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name installers-Windows --dir download
      shell: bash

    - name: Install Unigrid and give it a wallet to forget
      shell: pwsh
      run: |
        $msi = (Get-ChildItem download\*.msi).FullName
        Start-Process msiexec -ArgumentList "/i", "`"$msi`"", "/qn" -Wait
        $janus = Join-Path $env:USERPROFILE ".janus"
        New-Item -ItemType Directory -Force "$janus\wallets", "$janus\backups", "$janus\hedgehog\$env:HEDGEHOG" | Out-Null
        Set-Content "$janus\wallets\$env:EVM_WALLET" '{}'
        New-Item "$janus\backups\$env:BACKUP", "$janus\hedgehog.log" | Out-Null
        Set-Content "$janus\wallet" "$janus\wallets\$env:EVM_WALLET" -NoNewline
        try { Set-DisplayResolution -Width 1600 -Height 1000 -Force } catch { Write-Host "resolution: $_" }

    - name: Photograph the reset
      timeout-minutes: 8
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Windows.Forms, System.Drawing
        New-Item shots -ItemType Directory | Out-Null

        function Shot($name) {
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $canvas = [System.Drawing.Graphics]::FromImage($picture)
          $canvas.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $picture.Save((Join-Path $PWD "shots\$name"))
          Write-Host "saved $name ($($screen.Width)x$($screen.Height))"
        }

        function CloseExplorers {
          (New-Object -ComObject Shell.Application).Windows() | ForEach-Object { $_.Quit() }
          Start-Sleep 2
        }

        $janus = Join-Path $env:USERPROFILE ".janus"
        (New-Object -ComObject Shell.Application).MinimizeAll()
        Start-Sleep 2
        Shot "00-desktop.png"

        Start-Process explorer.exe "/select,`"$janus\wallet`""
        Start-Sleep 6
        Shot "01-explorer-wallet-selected.png"
        CloseExplorers

        $reset = Join-Path $env:RUNNER_TEMP "reset.ps1"
        Set-Content $reset @'
        function Run($command) {
          Write-Host "PS $HOME> " -NoNewline
          Write-Host $command
          Invoke-Expression $command
        }
        Set-Location $HOME
        Clear-Host
        Run 'Copy-Item -Recurse "$env:USERPROFILE\.janus" "$env:USERPROFILE\Desktop\janus-copy"'
        Run 'Remove-Item "$env:USERPROFILE\.janus\wallet"'
        Run 'Get-ChildItem "$env:USERPROFILE\.janus"'
        '@
        $shell = Start-Process powershell -ArgumentList "-NoExit", "-NoLogo", "-File", $reset -PassThru
        Start-Sleep 8
        Shot "02-powershell-reset.png"
        Stop-Process -Id $shell.Id

        Start-Process explorer.exe "`"$janus`""
        Start-Sleep 6
        Shot "03-explorer-wallet-gone.png"
        CloseExplorers

        Start-Process (Join-Path $env:LOCALAPPDATA "Unigrid\Unigrid.exe")
        Start-Sleep 20
        Shot "04-start-screen-20s.png"
        Start-Sleep 20
        Shot "05-start-screen-40s.png"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reset-windows
        path: shots

  linux:

    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
    - name: Fetch the release installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name installers-Linux --dir download

    - name: Install a desktop, Unigrid and a wallet to forget
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb xfwm4 xfconf thunar xfce4-terminal xdotool \
          imagemagick dbus-x11 adwaita-icon-theme-full fonts-dejavu-core
        sudo apt-get install -y ./download/*.deb
        mkdir -p ~/.janus/wallets ~/.janus/backups ~/.janus/hedgehog/$HEDGEHOG
        echo '{}' > ~/.janus/wallets/$EVM_WALLET
        : > ~/.janus/backups/$BACKUP
        : > ~/.janus/hedgehog.log
        printf '%s' ~/.janus/wallets/$EVM_WALLET > ~/.janus/wallet

    - name: Photograph the reset
      timeout-minutes: 8
      run: |
        mkdir shots
        export DISPLAY=:99
        Xvfb :99 -screen 0 1600x1000x24 &
        sleep 2
        eval "$(dbus-launch --sh-syntax)"
        xfwm4 &
        sleep 2
        xsetroot -solid '#3a5a7a'
        shot() { import -window root "shots/$1"; echo "saved $1"; }

        thunar ~/.janus &
        sleep 5
        xdotool key ctrl+h
        sleep 1
        xdotool type --delay 100 wallet
        sleep 1
        xdotool key Escape
        sleep 1
        shot 01-thunar-wallet-selected.png
        pkill thunar || true

        cat > ~/reset.sh <<'EOF'
        clear
        run() { printf '\033[1m%s\033[0m\n' "$ $1"; eval "$1"; }
        run 'cp -a ~/.janus ~/janus-copy'
        run 'rm ~/.janus/wallet'
        run 'ls ~/.janus'
        EOF
        xfce4-terminal --geometry=100x24 -x bash --rcfile ~/reset.sh &
        sleep 5
        shot 02-terminal-reset.png
        pkill xfce4-terminal || true

        thunar ~/.janus &
        sleep 5
        shot 03-thunar-wallet-gone.png
        pkill thunar || true

        /opt/unigrid/bin/Unigrid > unigrid.log 2>&1 &
        sleep 20
        shot 04-start-screen-20s.png
        sleep 20
        shot 05-start-screen-40s.png
        tail -50 unigrid.log || true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reset-linux
        path: shots
