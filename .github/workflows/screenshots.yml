name: Install screenshots

# Photographs what a person sees when they open the unsigned installers from a download, on the runners that
# have a desktop. Runs on this branch only and keeps the pictures as artifacts.
on:
  push:
    branches: [ "screenshots" ]

permissions:
  actions: read
  contents: read

jobs:
  macos:

    runs-on: macos-15
    timeout-minutes: 25

    steps:
    - name: Fetch the installer of an earlier installers run
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 36953666841 --repo "$GITHUB_REPOSITORY" --name installers-macOS --dir download

    - name: Put the app in Applications the way a download leaves it
      run: |
        spctl --status || true
        sw_vers
        stamp="0083;$(printf '%x' "$(date +%s)");Safari;"
        dmg=$(ls download/*.dmg)
        xattr -w com.apple.quarantine "$stamp" "$dmg"
        hdiutil attach -nobrowse -mountpoint /Volumes/UnigridInstaller "$dmg"
        cp -R /Volumes/UnigridInstaller/Unigrid.app /Applications/
        hdiutil detach /Volumes/UnigridInstaller
        xattr -w com.apple.quarantine "$stamp" /Applications/Unigrid.app
        xattr -l /Applications/Unigrid.app

    - name: Open it and photograph what macOS says
      timeout-minutes: 6
      run: |
        mkdir shots
        screencapture -x shots/00-desktop.png
        (open /Applications/Unigrid.app > open.log 2>&1 &)
        sleep 4
        screencapture -x shots/01-blocked-4s.png
        sleep 8
        screencapture -x shots/02-blocked-12s.png
        killall CoreServicesUIAgent || true
        sleep 2
        (open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Security" > settings.log 2>&1 &)
        sleep 10
        screencapture -x shots/03-security-section.png
        ls -l shots
        cat open.log settings.log || true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-macos
        path: shots

  windows:

    runs-on: windows-2022
    timeout-minutes: 25

    steps:
    - name: Fetch the installer of an earlier installers run
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 36953666841 --repo "$GITHUB_REPOSITORY" --name installers-Windows --dir download
      shell: bash

    - name: Open it the way a download leaves it and photograph what Windows says
      timeout-minutes: 6
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Windows.Forms, System.Drawing
        New-Item shots -ItemType Directory | Out-Null

        function Shot($name) {
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $canvas = [System.Drawing.Graphics]::FromImage($picture)
          $canvas.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $picture.Save((Join-Path $PWD "shots\$name"))
          Write-Host "saved $name"
        }

        Add-Type -TypeDefinition @"
        using System;
        using System.Runtime.InteropServices;
        public class Mouse {
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          public static void Click(int x, int y) {
            SetCursorPos(x, y);
            mouse_event(2, 0, 0, 0, UIntPtr.Zero);
            mouse_event(4, 0, 0, 0, UIntPtr.Zero);
          }
        }
        "@

        # The runner's own console is in the way, so everything is put out of sight first.
        (New-Object -ComObject Shell.Application).MinimizeAll()
        Start-Sleep 2

        $msi = Get-ChildItem download\*.msi
        Set-Content -Path $msi.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
        Shot "00-desktop.png"
        Start-Process -FilePath "explorer.exe" -ArgumentList $msi.FullName
        Start-Sleep 10
        Shot "01-windows-protected-your-pc.png"

        [Mouse]::Click(298, 228)
        Start-Sleep 3
        Shot "02-more-info.png"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-windows
        path: shots
